<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Odwołania2json</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
<main>
  <header>
    <h1>Odwołania<span>2</span>json</h1>
    <p>PDF → JSON</p>
  </header>

  <div class="intro">
    <div class="classes" id="classes" hidden></div>

    <label class="drop" id="drop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
      </svg>
      <strong>Przeciągnij pliki PDF albo folder tutaj</strong>
      <small>albo</small>
      <span class="pick">
        <span class="btn">Wybierz pliki</span>
        <span class="btn" id="pickFolder" role="button" tabindex="0">Wybierz folder</span>
      </span>
      <input id="input" type="file" accept="application/pdf,.pdf" multiple hidden>
      <input id="folderInput" type="file" webkitdirectory multiple hidden>
    </label>
  </div>

  <div class="toolbar" id="toolbar">
    <span id="summary"></span>
    <div class="actions">
      <button class="btn ghost" id="clear">Wyczyść</button>
      <button class="btn ghost" id="all" disabled
        title="Pliki .json w tej samej strukturze folderów co wgrane PDF-y (jak output/ w CLI)">Pobierz wszystkie (.zip)</button>
    </div>
  </div>
  <div id="list"></div>
</main>
</body>
</html>
