<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Odwołania2json</title>
  <style>
    :root {
      --bg: #f5f6f8; --card: #fff; --text: #1c1f24; --muted: #6b7280; --border: #dde1e6;
      --accent: #c8102e; --accent-soft: #fdecee; --ok: #15803d; --err: #b91c1c; --code: #f3f4f6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111317; --card: #1a1d23; --text: #e6e8eb; --muted: #9aa1ab; --border: #2c3038;
        --accent: #ef4458; --accent-soft: #2a1518; --ok: #4ade80; --err: #f87171; --code: #14161a;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 1180px; margin: 0 auto; padding: 40px 16px 64px; }
    .intro { max-width: 820px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 28px; }
    h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: -.02em; }
    h1 span { color: var(--accent); }
    header p { margin: 0; color: var(--muted); }

    .drop { display: flex; flex-direction: column; align-items: center; gap: 12px;
      padding: 48px 16px; border: 2px dashed var(--border); border-radius: 14px;
      background: var(--card); text-align: center; cursor: pointer; transition: .15s; }
    .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
    .drop svg { width: 44px; height: 44px; color: var(--accent); }
    .drop strong { font-size: 17px; }
    .drop small { color: var(--muted); }
    .btn { border: 0; border-radius: 8px; padding: 10px 18px; font: inherit; font-weight: 600;
      background: var(--accent); color: #fff; cursor: pointer; }
    .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border);
      padding: 6px 12px; font-weight: 500; font-size: 13px; }
    .btn:disabled { opacity: .5; cursor: default; }

    .toolbar { display: none; justify-content: space-between; align-items: center;
      margin: 24px 0 10px; gap: 8px; flex-wrap: wrap; }
    .toolbar.show { display: flex; }
    .toolbar span { color: var(--muted); font-size: 14px; }

    .item { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      margin-bottom: 10px; overflow: hidden; }
    .row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
    .row .name { flex: 1; min-width: 0; }
    .row .name b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .name small { color: var(--muted); }
    .badge { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px;
      background: var(--code); white-space: nowrap; }
    .badge.ok { color: var(--ok); } .badge.err { color: var(--err); }
    .actions { display: flex; gap: 6px; }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    details { border-top: 1px solid var(--border); }
    summary { padding: 10px 16px; cursor: pointer; color: var(--muted); font-size: 13px; }
    pre { margin: 0; padding: 14px 16px; background: var(--code); font-size: 12.5px;
      overflow: auto; max-height: 420px; }
    .meta { padding: 0 16px 12px; color: var(--muted); font-size: 13px; }
    .meta b { color: var(--text); font-weight: 600; }

    /* PDF i JSON obok siebie - łatwe porównanie wyniku z dokumentem */
    .compare { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1px;
      background: var(--border); border-top: 1px solid var(--border); }
    .compare > div { background: var(--card); display: flex; flex-direction: column; min-width: 0; }
    .compare h3 { margin: 0; padding: 8px 16px; font-size: 12px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--border); }
    .compare iframe { border: 0; width: 100%; height: 640px; background: #525659; }
    .compare pre { max-height: none; height: 640px; flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; }
    .compare .empty { padding: 16px; color: var(--muted); font-size: 13px; }
    .j-key { color: #1d4ed8; } .j-str { color: #15803d; } .j-num { color: #b45309; } .j-null { color: var(--muted); }
    @media (prefers-color-scheme: dark) {
      .j-key { color: #93c5fd; } .j-str { color: #86efac; } .j-num { color: #fcd34d; }
    }
    @media (max-width: 900px) {
      .compare { grid-template-columns: 1fr; }
      .compare iframe, .compare pre { height: 480px; }
    }

    .classes { display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
      gap: 6px; margin: -12px 0 20px; font-size: 13px; color: var(--muted); }
    .chip { padding: 3px 10px; border-radius: 99px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); cursor: help; }
    .classes .note { flex-basis: 100%; text-align: center; font-size: 12px; }

    @media (max-width: 560px) {
      .row { flex-wrap: wrap; }
      .actions { width: 100%; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Odwołania<span>2</span>json</h1>
    <p>PDF → JSON</p>
  </header>

  <div class="intro">
  <div class="classes" id="classes" hidden></div>

  <label class="drop" id="drop">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
      <path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
    </svg>
    <strong>Przeciągnij pliki PDF tutaj</strong>
    <small>albo</small>
    <span class="btn">Wybierz pliki</span>
    <small>Można wgrać kilka dokumentów naraz</small>
    <input id="input" type="file" accept="application/pdf,.pdf" multiple hidden>
  </label>
  </div>

  <div class="toolbar" id="toolbar">
    <span id="summary"></span>
    <div class="actions">
      <button class="btn ghost" id="clear">Wyczyść</button>
      <button class="btn ghost" id="all" disabled>Pobierz wszystkie (.json)</button>
    </div>
  </div>
  <div id="list"></div>
</main>

<script>
  const drop = document.getElementById("drop");
  const input = document.getElementById("input");
  const list = document.getElementById("list");
  const toolbar = document.getElementById("toolbar");
  const results = []; // {name, data}
  let pending = 0;
  let labels = {}; // class name -> display label

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  // Supported document classes come from backend config (YAML), so new classes show up automatically
  (async () => {
    try {
      const classes = await (await fetch("/api/classes")).json();
      const box = document.getElementById("classes");
      labels = Object.fromEntries(Object.values(classes).map((c) => [c.name, c.label || c.name]));
      box.innerHTML = "<span>Obsługiwane dokumenty:</span>" +
        Object.values(classes).map((c) =>
          `<span class="chip" title="${esc(c.description.trim())}">${esc(c.label || c.name)}</span>`).join("") +
        `<span class="note">Inne dokumenty nie są klasyfikowane – dostają pusty plik JSON.</span>`;
      box.hidden = false;
    } catch { /* list is optional - upload still works without it */ }
  })();
  const kb = (n) => n > 1e6 ? (n / 1e6).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1e3)) + " KB";

  // dokument spoza klas -> pusty plik (jak w wymaganiach UZP)
  const toText = (obj) => obj == null ? "" : JSON.stringify(obj, null, 2);
  const pdfUrls = []; // object URLs of uploaded PDFs (preview), released on "Wyczyść"

  // JSON with coloured keys / values (escaped first, so document text cannot inject HTML)
  const highlight = (obj) => esc(toText(obj)).replace(
    /(&quot;(?:[^&]|&(?!quot;))*?&quot;)(\s*:)?|\b(-?\d+(?:\.\d+)?)\b|\bnull\b/g,
    (m, str, colon, num) => str ? `<span class="${colon ? "j-key" : "j-str"}">${str}</span>${colon || ""}`
      : num ? `<span class="j-num">${num}</span>` : `<span class="j-null">null</span>`);

  const METHODS = { rules: "reguły wbudowane", yaml: "reguły z YAML", llm: "LLM", none: "brak reguł" };
  function howExtracted(trace) {
    const pages = trace.pages || [];
    const ocr = pages.filter((p) => p.source === "ocr").map((p) => p.number);
    const text = !pages.length ? "brak tekstu"
      : ocr.length === pages.length ? `OCR (skan), str. ${ocr.join(", ")}`
      : ocr.length ? `warstwa tekstowa + OCR str. ${ocr.join(", ")}` : `warstwa tekstowa, str. 1–${pages.length}`;
    const method = trace.extraction?.method;
    const how = method ? method.split("+").map((m) => METHODS[m] || m).join(" + ") : null;
    return `Tekst: <b>${esc(text)}</b>` + (how ? ` · Ekstrakcja: <b>${esc(how)}</b>` : "");
  }

  function download(name, obj) {
    const blob = new Blob([toText(obj)], { type: "application/json" });
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: name });
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function updateToolbar() {
    toolbar.classList.toggle("show", list.children.length > 0);
    document.getElementById("summary").textContent =
      pending ? `Przetwarzanie… (${pending} w kolejce)` : `Gotowe: ${results.length} plik(ów)`;
    document.getElementById("all").disabled = pending > 0 || results.length === 0;
  }

  async function processFile(file) {
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = `<div class="row">
        <div class="spinner"></div>
        <div class="name"><b>${esc(file.name)}</b><small>${kb(file.size)} · przetwarzanie…</small></div>
      </div>`;
    list.prepend(el);
    pending++; updateToolbar();

    try {
      if (!/\.pdf$/i.test(file.name)) throw new Error("To nie jest plik PDF");
      const fd = new FormData();
      fd.append("files", file);
      const res = await fetch("/api/extract", { method: "POST", body: fd });
      const body = await res.json();
      if (!res.ok) throw new Error(body.detail || `Błąd ${res.status}`);
      const result = body[0];
      const data = result.data; // kanoniczny JSON (null = dokument spoza klas)
      const trace = result.trace || {};
      const jsonName = file.name.replace(/\.pdf$/i, "") + ".json";
      results.push({ name: jsonName, data });

      const cls = trace.classification || {};
      const conf = cls.confidence != null ? ` · ${Math.round(cls.confidence * 100)}%` : "";
      const ocr = (trace.pages || []).filter((p) => p.source === "ocr").length;
      const known = data != null;
      const label = known ? (labels[result.document_type] || result.document_type) : "nie rozpoznano";
      el.innerHTML = `<div class="row">
          <span class="badge ${known ? "ok" : "err"}">${esc(label)}${conf}</span>
          <div class="name"><b>${esc(file.name)}</b>
            <small>${kb(file.size)} · ${trace.pages?.length ?? 0} str.${ocr ? ` (OCR: ${ocr})` : ""}${trace.seconds ? ` · ${trace.seconds}s` : ""}</small></div>
          <div class="actions">
            <button class="btn ghost" data-act="copy">Kopiuj</button>
            <button class="btn" data-act="dl">Pobierz JSON</button>
          </div>
        </div>
        ${cls.reason ? `<div class="meta">${esc(cls.reason)}</div>` : ""}
        <div class="meta">${howExtracted(trace)}</div>
        <details data-compare><summary>Porównaj PDF i JSON</summary>
          <div class="compare">
            <div><h3>Dokument PDF</h3><iframe title="Podgląd PDF: ${esc(file.name)}" loading="lazy"></iframe></div>
            <div><h3>Wynik JSON</h3>${known ? `<pre>${highlight(data)}</pre>`
              : `<div class="empty">Pusty plik JSON – dokument spoza obsługiwanych klas.</div>`}</div>
          </div>
        </details>
        <details><summary>Ślad przetwarzania (pełny)</summary><pre>${esc(JSON.stringify(trace, null, 2))}</pre></details>`;
      // PDF preview straight from the uploaded file (nothing is stored on the server)
      const compare = el.querySelector("[data-compare]");
      compare.addEventListener("toggle", () => {
        const frame = compare.querySelector("iframe");
        if (compare.open && !frame.src) {
          const url = URL.createObjectURL(file);
          pdfUrls.push(url);
          frame.src = url;
        }
      });
      el.querySelector('[data-act="dl"]').onclick = () => download(jsonName, data);
      el.querySelector('[data-act="copy"]').onclick = async (e) => {
        await navigator.clipboard.writeText(toText(data));
        e.target.textContent = "Skopiowano"; setTimeout(() => (e.target.textContent = "Kopiuj"), 1500);
      };
    } catch (err) {
      el.innerHTML = `<div class="row">
          <span class="badge err">błąd</span>
          <div class="name"><b>${esc(file.name)}</b><small>${esc(err.message)}</small></div>
        </div>`;
    } finally {
      pending--; updateToolbar();
    }
  }

  function handle(files) { [...files].forEach(processFile); }

  input.onchange = () => { handle(input.files); input.value = ""; };
  ["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => handle(e.dataTransfer.files));
  document.getElementById("all").onclick = () =>
    download("odwolania2json.json", Object.fromEntries(results.map((r) => [r.name, r.data])));
  document.getElementById("clear").onclick = () => {
    if (pending) return;
    list.innerHTML = ""; results.length = 0;
    pdfUrls.splice(0).forEach((url) => URL.revokeObjectURL(url));
    updateToolbar();
  };
</script>
</body>
</html>
