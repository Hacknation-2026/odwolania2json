# Opcjonalnie (wymagane przez UZP uruchomienie to start.bat)
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false  # .env jest opcjonalny - aplikacja działa w całości lokalnie
    ports:
      - "8000:8000"  # Swagger: http://localhost:8000/docs
    volumes:
      # klasy dokumentów edytowalne bez przebudowy obrazu
      - ./backend/config:/srv/backend/config:ro

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
